<script>
    let tarjetas = [];
    let gastosFijos = [];
    let editandoId = null;
    let editandoTipo = null;

    document.addEventListener('DOMContentLoaded', async () => {
        await window.app.abrirDB();
        await cargarConfiguracion();
        await cargarTarjetas();
        await cargarGastosFijos();
        await window.app.inicializarSubcategorias();
        
        setTimeout(async () => {
            await window.app.verificarRecordatorios();
        }, 3000);
    });

    // ============ CONFIGURACIÓN ============
    async function cargarConfiguracion() {
        const moneda = await window.app.obtenerConfiguracion('moneda');
        const anio = await window.app.obtenerConfiguracion('anio');
        
        if (moneda) document.getElementById('monedaSelect').value = moneda;
        if (anio) document.getElementById('anioInput').value = anio;
        else document.getElementById('anioInput').value = new Date().getFullYear();

        const tema = localStorage.getItem('tema');
        if (tema === 'oscuro') {
            document.getElementById('darkModeToggle').checked = true;
            document.body.classList.add('dark');
        }
    }

    async function guardarConfiguracion() {
        const moneda = document.getElementById('monedaSelect').value;
        const anio = parseInt(document.getElementById('anioInput').value);

        await window.app.guardarConfiguracion('moneda', moneda);
        await window.app.guardarConfiguracion('anio', anio);
        localStorage.setItem('moneda', moneda);

        alert('✅ Configuración guardada correctamente');
    }

    function toggleDarkMode() {
        const checked = document.getElementById('darkModeToggle').checked;
        if (checked) {
            document.body.classList.add('dark');
            localStorage.setItem('tema', 'oscuro');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('tema', 'claro');
        }
    }

    // ============ TARJETAS ============
    async function cargarTarjetas() {
        tarjetas = await window.app.obtenerTarjetas();
        renderizarTarjetas();
    }

    function renderizarTarjetas() {
        const container = document.getElementById('listaTarjetas');
        if (tarjetas.length === 0) {
            container.innerHTML = '<div class="vacio">No hay tarjetas registradas</div>';
            return;
        }

        let html = '';
        const moneda = localStorage.getItem('moneda') || '$';
        for (const t of tarjetas) {
            html += `
                <div class="item">
                    <div class="info">
                        <span class="tag tarjeta">💳</span>
                        <strong>${t.nombre}</strong>
                        <span>Corte: ${t.diaCorte}</span>
                        <span>Pago: ${t.diaPago}</span>
                        <span class="deuda-total">Deuda: ${window.app.formatearMoneda(t.deudaActual || 0, moneda)}</span>
                    </div>
                    <span class="acciones">
                        <button class="editar" onclick="editarTarjeta(${t.id})">✏️</button>
                        <button class="eliminar" onclick="eliminarTarjeta(${t.id})">🗑️</button>
                    </span>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // IMPORTANTE: Esta función debe existir y ser GLOBAL
    window.agregarTarjeta = async function() {
        const nombre = document.getElementById('tarjetaNombre').value.trim();
        const diaCorte = parseInt(document.getElementById('tarjetaCorte').value);
        const diaPago = parseInt(document.getElementById('tarjetaPago').value);
        const deudaActual = parseFloat(document.getElementById('tarjetaDeuda').value) || 0;

        if (!nombre) { alert('Ingresa el nombre de la tarjeta'); return; }
        if (!diaCorte || diaCorte < 1 || diaCorte > 31) { alert('Ingresa un día de corte válido (1-31)'); return; }
        if (!diaPago || diaPago < 1 || diaPago > 31) { alert('Ingresa un día de pago válido (1-31)'); return; }

        await window.app.guardarTarjeta({ nombre, diaCorte, diaPago, deudaActual });
        
        document.getElementById('tarjetaNombre').value = '';
        document.getElementById('tarjetaCorte').value = '';
        document.getElementById('tarjetaPago').value = '';
        document.getElementById('tarjetaDeuda').value = '';
        
        await cargarTarjetas();
        alert('✅ Tarjeta agregada correctamente');
    };

    // ============ GASTOS FIJOS ============
    async function cargarGastosFijos() {
        gastosFijos = await window.app.obtenerGastosFijos();
        renderizarGastosFijos();
    }

    function renderizarGastosFijos() {
        const container = document.getElementById('listaGastosFijos');
        if (gastosFijos.length === 0) {
            container.innerHTML = '<div class="vacio">No hay gastos fijos registrados</div>';
            return;
        }

        let html = '';
        const moneda = localStorage.getItem('moneda') || '$';
        const emojis = {
            'GASTOS_ESENCIALES': '🏠',
            'GASTOS_DISCRECIONALES': '🎮',
            'PAGO_DEUDAS': '💳',
            'AHORROS': '🏦'
        };
        const frecuencias = {
            'mensual': 'Cada mes',
            'bimestral': 'Cada 2 meses',
            'trimestral': 'Cada 3 meses',
            'semestral': 'Cada 6 meses',
            'anual': 'Cada año'
        };

        for (const g of gastosFijos) {
            html += `
                <div class="item">
                    <div class="info">
                        <span class="tag gasto">${emojis[g.categoria] || '📌'}</span>
                        <strong>${g.nombre}</strong>
                        <span>${window.app.formatearMoneda(g.monto, moneda)}</span>
                        <span>Día ${g.diaPago}</span>
                        <span style="font-size:11px; color:#999;">${frecuencias[g.frecuencia] || g.frecuencia}</span>
                    </div>
                    <span class="acciones">
                        <button class="editar" onclick="editarGastoFijo(${g.id})">✏️</button>
                        <button class="eliminar" onclick="eliminarGastoFijo(${g.id})">🗑️</button>
                    </span>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    window.agregarGastoFijo = async function() {
        const nombre = document.getElementById('gastoNombre').value.trim();
        const monto = parseFloat(document.getElementById('gastoMonto').value);
        const diaPago = parseInt(document.getElementById('gastoDia').value);
        const categoria = document.getElementById('gastoCategoria').value;
        const frecuencia = document.getElementById('gastoFrecuencia').value;

        if (!nombre) { alert('Ingresa el nombre del gasto'); return; }
        if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }
        if (!diaPago || diaPago < 1 || diaPago > 31) { alert('Ingresa un día de pago válido (1-31)'); return; }

        await window.app.guardarGastoFijo({ nombre, monto, categoria, subcategoria: nombre, diaPago, frecuencia });
        
        document.getElementById('gastoNombre').value = '';
        document.getElementById('gastoMonto').value = '';
        document.getElementById('gastoDia').value = '';
        
        await cargarGastosFijos();
        alert('✅ Gasto fijo agregado correctamente');
    };

    // ============ ELIMINAR ============
    async function eliminarTarjeta(id) {
        const tarjeta = tarjetas.find(t => t.id === id);
        if (!confirm(`¿Eliminar la tarjeta "${tarjeta.nombre}"?`)) return;
        await window.app.eliminarTarjeta(id);
        await cargarTarjetas();
        alert('🗑️ Tarjeta eliminada');
    }

    async function eliminarGastoFijo(id) {
        const gasto = gastosFijos.find(g => g.id === id);
        if (!confirm(`¿Eliminar el gasto fijo "${gasto.nombre}"?`)) return;
        await window.app.eliminarGastoFijo(id);
        await cargarGastosFijos();
        alert('🗑️ Gasto fijo eliminado');
    }

    // ============ EXPORTAR/IMPORTAR ============
    async function exportarDatos() {
        const tx = window.app.db.transaction(['presupuesto', 'transacciones', 'patrimonio', 'subcategorias', 'tarjetas', 'gastosFijos'], 'readonly');
        
        const presupuesto = await new Promise(resolve => { const req = tx.objectStore('presupuesto').getAll(); req.onsuccess = () => resolve(req.result); });
        const transacciones = await new Promise(resolve => { const req = tx.objectStore('transacciones').getAll(); req.onsuccess = () => resolve(req.result); });
        const patrimonio = await new Promise(resolve => { const req = tx.objectStore('patrimonio').getAll(); req.onsuccess = () => resolve(req.result); });
        const subcategorias = await new Promise(resolve => { const req = tx.objectStore('subcategorias').getAll(); req.onsuccess = () => resolve(req.result); });
        const tarjetas = await new Promise(resolve => { const req = tx.objectStore('tarjetas').getAll(); req.onsuccess = () => resolve(req.result); });
        const gastosFijos = await new Promise(resolve => { const req = tx.objectStore('gastosFijos').getAll(); req.onsuccess = () => resolve(req.result); });

        const data = { presupuesto, transacciones, patrimonio, subcategorias, tarjetas, gastosFijos };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `presupuesto_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    async function importarDatos(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (!confirm('⚠️ Esto sobrescribirá todos tus datos actuales. ¿Continuar?')) return;

                const tx = window.app.db.transaction(['presupuesto', 'transacciones', 'patrimonio', 'subcategorias', 'tarjetas', 'gastosFijos'], 'readwrite');
                tx.objectStore('presupuesto').clear();
                tx.objectStore('transacciones').clear();
                tx.objectStore('patrimonio').clear();
                tx.objectStore('subcategorias').clear();
                tx.objectStore('tarjetas').clear();
                tx.objectStore('gastosFijos').clear();

                if (data.presupuesto) data.presupuesto.forEach(item => tx.objectStore('presupuesto').add(item));
                if (data.transacciones) data.transacciones.forEach(item => tx.objectStore('transacciones').add(item));
                if (data.patrimonio) data.patrimonio.forEach(item => tx.objectStore('patrimonio').add(item));
                if (data.subcategorias) data.subcategorias.forEach(item => tx.objectStore('subcategorias').add(item));
                if (data.tarjetas) data.tarjetas.forEach(item => tx.objectStore('tarjetas').add(item));
                if (data.gastosFijos) data.gastosFijos.forEach(item => tx.objectStore('gastosFijos').add(item));

                alert('✅ Datos importados correctamente');
                location.reload();
            } catch (error) {
                alert('❌ Error al importar: ' + error.message);
            }
        };
        reader.readAsText(file);
    }

    async function eliminarTodosLosDatos() {
        if (!confirm('⚠️ ¿Estás SEGURO? Esto eliminará TODOS tus datos. Esta acción no se puede deshacer.')) return;
        if (!confirm('⚠️ Última advertencia: ¿Realmente quieres eliminar todo?')) return;

        const tx = window.app.db.transaction(['presupuesto', 'transacciones', 'patrimonio', 'subcategorias', 'tarjetas', 'gastosFijos'], 'readwrite');
        tx.objectStore('presupuesto').clear();
        tx.objectStore('transacciones').clear();
        tx.objectStore('patrimonio').clear();
        tx.objectStore('subcategorias').clear();
        tx.objectStore('tarjetas').clear();
        tx.objectStore('gastosFijos').clear();

        alert('🗑️ Todos los datos han sido eliminados');
        location.reload();
    }
</script>
